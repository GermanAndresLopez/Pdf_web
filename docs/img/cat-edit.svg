<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="702" viewBox="0 0 1000 702" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Inter,Helvetica,Arial,sans-serif">
  <defs><linearGradient id="g-edit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ac8fa"/><stop offset="1" stop-color="#007aff"/></linearGradient><linearGradient id="g-forms" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8e9bff"/><stop offset="1" stop-color="#5856d6"/></linearGradient><linearGradient id="g-watermark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#66d4cf"/><stop offset="1" stop-color="#30b0c7"/></linearGradient><linearGradient id="g-numbers" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7aa8"/><stop offset="1" stop-color="#ff2d55"/></linearGradient><linearGradient id="g-bookmarks" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd60a"/><stop offset="1" stop-color="#ff9f0a"/></linearGradient><linearGradient id="g-metadata" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a2a2a8"/><stop offset="1" stop-color="#636366"/></linearGradient><linearGradient id="g-attach" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ad0ff"/><stop offset="1" stop-color="#3a8dde"/></linearGradient><linearGradient id="g-compare" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9f7a"/><stop offset="1" stop-color="#ff6a3d"/></linearGradient>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity=".09"/></filter></defs><rect width="1000" height="702" rx="28" fill="#f2f2f7"/>
  <text x="40" y="62" font-size="34" font-weight="800" fill="#111">Editar y revisar</text>
  <text x="40" y="92" font-size="16" fill="#6b6b73">8 herramientas</text><g filter="url(#sh)"><rect x="40" y="120" width="460" height="118" rx="22" fill="#fff"/></g><rect x="60" y="140" width="56" height="56" rx="14" fill="url(#g-edit)"/><g transform="translate(74 154) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></g>
    <text x="134" y="158" font-size="19" font-weight="700" fill="#111">Editar PDF</text>
    <text x="134" y="182" font-size="14" fill="#6b6b73">Cambia el texto existente, añade texto,</text><text x="134" y="202" font-size="14" fill="#6b6b73">formas, dibujos, imágenes y firma.</text><g filter="url(#sh)"><rect x="520" y="120" width="460" height="118" rx="22" fill="#fff"/></g><rect x="540" y="140" width="56" height="56" rx="14" fill="url(#g-forms)"/><g transform="translate(554 154) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16H5zM8 9h2M12 9h4M8 14h2M12 14h4"/></g>
    <text x="614" y="158" font-size="19" font-weight="700" fill="#111">Rellenar formularios</text>
    <text x="614" y="182" font-size="14" fill="#6b6b73">Completa campos, casillas y desplegables de un</text><text x="614" y="202" font-size="14" fill="#6b6b73">PDF con formulario.</text><g filter="url(#sh)"><rect x="40" y="258" width="460" height="118" rx="22" fill="#fff"/></g><rect x="60" y="278" width="56" height="56" rx="14" fill="url(#g-watermark)"/><g transform="translate(74 292) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></g>
    <text x="134" y="296" font-size="19" font-weight="700" fill="#111">Marca de agua</text>
    <text x="134" y="320" font-size="14" fill="#6b6b73">Estampa texto o un logo, en mosaico o en una</text><text x="134" y="340" font-size="14" fill="#6b6b73">esquina, con vista previa.</text><g filter="url(#sh)"><rect x="520" y="258" width="460" height="118" rx="22" fill="#fff"/></g><rect x="540" y="278" width="56" height="56" rx="14" fill="url(#g-numbers)"/><g transform="translate(554 292) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"/></g>
    <text x="614" y="296" font-size="19" font-weight="700" fill="#111">Números de página</text>
    <text x="614" y="320" font-size="14" fill="#6b6b73">Numeración con formatos, romanos, plantillas y</text><text x="614" y="340" font-size="14" fill="#6b6b73">posición espejo, con vista previa.</text><g filter="url(#sh)"><rect x="40" y="396" width="460" height="118" rx="22" fill="#fff"/></g><rect x="60" y="416" width="56" height="56" rx="14" fill="url(#g-bookmarks)"/><g transform="translate(74 430) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></g>
    <text x="134" y="434" font-size="19" font-weight="700" fill="#111">Marcadores e índice</text>
    <text x="134" y="458" font-size="14" fill="#6b6b73">Crea el índice lateral del PDF; detecta los</text><text x="134" y="478" font-size="14" fill="#6b6b73">títulos automáticamente.</text><g filter="url(#sh)"><rect x="520" y="396" width="460" height="118" rx="22" fill="#fff"/></g><rect x="540" y="416" width="56" height="56" rx="14" fill="url(#g-metadata)"/><g transform="translate(554 430) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11v5M12 8h.01"/></g>
    <text x="614" y="434" font-size="19" font-weight="700" fill="#111">Metadatos</text>
    <text x="614" y="458" font-size="14" fill="#6b6b73">Edita título, autor y palabras clave o</text><text x="614" y="478" font-size="14" fill="#6b6b73">elimínalos todos.</text><g filter="url(#sh)"><rect x="40" y="534" width="460" height="118" rx="22" fill="#fff"/></g><rect x="60" y="554" width="56" height="56" rx="14" fill="url(#g-attach)"/><g transform="translate(74 568) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11 12 19a5 5 0 0 1-7-7l8-8a3.5 3.5 0 0 1 5 5l-8 8a2 2 0 0 1-3-3l7-7"/></g>
    <text x="134" y="572" font-size="19" font-weight="700" fill="#111">Adjuntar archivos</text>
    <text x="134" y="596" font-size="14" fill="#6b6b73">Incrusta archivos dentro del PDF.</text><g filter="url(#sh)"><rect x="520" y="534" width="460" height="118" rx="22" fill="#fff"/></g><rect x="540" y="554" width="56" height="56" rx="14" fill="url(#g-compare)"/><g transform="translate(554 568) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h7v16H4zM13 4h7v16h-7z"/></g>
    <text x="614" y="572" font-size="19" font-weight="700" fill="#111">Comparar PDF</text>
    <text x="614" y="596" font-size="14" fill="#6b6b73">Detecta diferencias visuales y de texto entre</text><text x="614" y="616" font-size="14" fill="#6b6b73">dos versiones.</text></svg>