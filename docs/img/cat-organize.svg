<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="564" viewBox="0 0 1000 564" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Inter,Helvetica,Arial,sans-serif">
  <defs><linearGradient id="g-merge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b5e"/><stop offset="1" stop-color="#ff3b30"/></linearGradient><linearGradient id="g-split" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb340"/><stop offset="1" stop-color="#ff9500"/></linearGradient><linearGradient id="g-organize" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bf5af2"/><stop offset="1" stop-color="#8944ab"/></linearGradient><linearGradient id="g-delete" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a80"/><stop offset="1" stop-color="#e53935"/></linearGradient><linearGradient id="g-rotate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64d2ff"/><stop offset="1" stop-color="#32ade6"/></linearGradient><linearGradient id="g-crop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7be0a6"/><stop offset="1" stop-color="#2db36b"/></linearGradient>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity=".09"/></filter></defs><rect width="1000" height="564" rx="28" fill="#f2f2f7"/>
  <text x="40" y="62" font-size="34" font-weight="800" fill="#111">Organizar</text>
  <text x="40" y="92" font-size="16" fill="#6b6b73">6 herramientas</text><g filter="url(#sh)"><rect x="40" y="120" width="460" height="118" rx="22" fill="#fff"/></g><rect x="60" y="140" width="56" height="56" rx="14" fill="url(#g-merge)"/><g transform="translate(74 154) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8h11v12H8zM5 16H4V4h11v1"/></g>
    <text x="134" y="158" font-size="19" font-weight="700" fill="#111">Unir PDF</text>
    <text x="134" y="182" font-size="14" fill="#6b6b73">Combina varios PDF en uno, elige las páginas</text><text x="134" y="202" font-size="14" fill="#6b6b73">de cada archivo y añade marcadores.</text><g filter="url(#sh)"><rect x="520" y="120" width="460" height="118" rx="22" fill="#fff"/></g><rect x="540" y="140" width="56" height="56" rx="14" fill="url(#g-split)"/><g transform="translate(554 154) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M7 8 3 12l4 4M17 8l4 4-4 4"/></g>
    <text x="614" y="158" font-size="19" font-weight="700" fill="#111">Dividir PDF</text>
    <text x="614" y="182" font-size="14" fill="#6b6b73">Separa por rangos, cada N páginas, por tamaño,</text><text x="614" y="202" font-size="14" fill="#6b6b73">por hojas en blanco o extrae páginas.</text><g filter="url(#sh)"><rect x="40" y="258" width="460" height="118" rx="22" fill="#fff"/></g><rect x="60" y="278" width="56" height="56" rx="14" fill="url(#g-organize)"/><g transform="translate(74 292) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></g>
    <text x="134" y="296" font-size="19" font-weight="700" fill="#111">Organizar páginas</text>
    <text x="134" y="320" font-size="14" fill="#6b6b73">Reordena, gira, duplica, elimina e inserta</text><text x="134" y="340" font-size="14" fill="#6b6b73">páginas en blanco u otros PDF.</text><g filter="url(#sh)"><rect x="520" y="258" width="460" height="118" rx="22" fill="#fff"/></g><rect x="540" y="278" width="56" height="56" rx="14" fill="url(#g-delete)"/><g transform="translate(554 292) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></g>
    <text x="614" y="296" font-size="19" font-weight="700" fill="#111">Eliminar o extraer páginas</text>
    <text x="614" y="320" font-size="14" fill="#6b6b73">Elige páginas con miniaturas y quítalas o</text><text x="614" y="340" font-size="14" fill="#6b6b73">conserva solo esas.</text><g filter="url(#sh)"><rect x="40" y="396" width="460" height="118" rx="22" fill="#fff"/></g><rect x="60" y="416" width="56" height="56" rx="14" fill="url(#g-rotate)"/><g transform="translate(74 430) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></g>
    <text x="134" y="434" font-size="19" font-weight="700" fill="#111">Girar y enderezar</text>
    <text x="134" y="458" font-size="14" fill="#6b6b73">Gira 90°/180° o endereza escaneos torcidos con</text><text x="134" y="478" font-size="14" fill="#6b6b73">un ángulo libre.</text><g filter="url(#sh)"><rect x="520" y="396" width="460" height="118" rx="22" fill="#fff"/></g><rect x="540" y="416" width="56" height="56" rx="14" fill="url(#g-crop)"/><g transform="translate(554 430) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14"/></g>
    <text x="614" y="434" font-size="19" font-weight="700" fill="#111">Recortar PDF</text>
    <text x="614" y="458" font-size="14" fill="#6b6b73">Recorta márgenes a mano o quita los blancos</text><text x="614" y="478" font-size="14" fill="#6b6b73">automáticamente.</text></svg>