  <text x="40" y="62" font-size="34" font-weight="800" fill="#111">Seguridad</text>
  <text x="40" y="92" font-size="16" fill="#6b6b73">3 herramientas</text><g filter="url(#sh)"><rect x="40" y="120" width="460" height="118" rx="22" fill="#fff"/></g><rect x="60" y="140" width="56" height="56" rx="14" fill="url(#g-protect)"/><g transform="translate(74 154) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h12v9H6zM8 11V8a4 4 0 0 1 8 0v3"/></g>
    <text x="134" y="158" font-size="19" font-weight="700" fill="#111">Proteger PDF</text>
    <text x="134" y="182" font-size="14" fill="#6b6b73">Cifra con contraseña y limita imprimir, copiar</text><text x="134" y="202" font-size="14" fill="#6b6b73">o modificar.</text><g filter="url(#sh)"><rect x="520" y="120" width="460" height="118" rx="22" fill="#fff"/></g><rect x="540" y="140" width="56" height="56" rx="14" fill="url(#g-unlock)"/><g transform="translate(554 154) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h12v9H6zM8 11V8a4 4 0 0 1 7.5-2"/></g>
    <text x="614" y="158" font-size="19" font-weight="700" fill="#111">Desbloquear PDF</text>
    <text x="614" y="182" font-size="14" fill="#6b6b73">Quita la contraseña de un PDF si la conoces.</text><g filter="url(#sh)"><rect x="40" y="258" width="460" height="118" rx="22" fill="#fff"/></g><rect x="60" y="278" width="56" height="56" rx="14" fill="url(#g-redact)"/><g transform="translate(74 292) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6zM12 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM4 4l16 16"/></g>
    <text x="134" y="296" font-size="19" font-weight="700" fill="#111">Censurar información</text>
    <text x="134" y="320" font-size="14" fill="#6b6b73">Tapa datos sensibles de verdad: busca por</text><text x="134" y="340" font-size="14" fill="#6b6b73">texto, correos, teléfonos o fechas.</text></svg>