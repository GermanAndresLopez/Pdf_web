<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Inter,Helvetica,Arial,sans-serif">
  <defs><linearGradient id="g-word-to-pdf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f9bff"/><stop offset="1" stop-color="#1c5fd6"/></linearGradient><linearGradient id="g-pdf-to-word" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5e8bff"/><stop offset="1" stop-color="#2a4bd7"/></linearGradient><linearGradient id="g-excel-to-pdf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fd68a"/><stop offset="1" stop-color="#1e9e55"/></linearGradient><linearGradient id="g-pdf-to-excel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34c759"/><stop offset="1" stop-color="#188038"/></linearGradient><linearGradient id="g-pdf-to-pptx" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9560"/><stop offset="1" stop-color="#e0501f"/></linearGradient><linearGradient id="g-img-to-pdf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd60a"/><stop offset="1" stop-color="#ff9f0a"/></linearGradient><linearGradient id="g-pdf-to-img" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9f7a"/><stop offset="1" stop-color="#ff6a3d"/></linearGradient><linearGradient id="g-text-to-pdf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8e8e93"/><stop offset="1" stop-color="#636366"/></linearGradient><linearGradient id="g-ocr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b388ff"/><stop offset="1" stop-color="#7c4dff"/></linearGradient>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity=".09"/></filter></defs><rect width="1000" height="840" rx="28" fill="#f2f2f7"/>
  <text x="40" y="62" font-size="34" font-weight="800" fill="#111">Convertir</text>
  <text x="40" y="92" font-size="16" fill="#6b6b73">9 herramientas</text><g filter="url(#sh)"><rect x="40" y="120" width="460" height="118" rx="22" fill="#fff"/></g><rect x="60" y="140" width="56" height="56" rx="14" fill="url(#g-word-to-pdf)"/><g transform="translate(74 154) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4zM8 9l1.5 6L12 10l2.5 5L16 9"/></g>
    <text x="134" y="158" font-size="19" font-weight="700" fill="#111">Word a PDF</text>
    <text x="134" y="182" font-size="14" fill="#6b6b73">Convierte uno o varios .docx con tamaño,</text><text x="134" y="202" font-size="14" fill="#6b6b73">márgenes y fuente a elección.</text><g filter="url(#sh)"><rect x="520" y="120" width="460" height="118" rx="22" fill="#fff"/></g><rect x="540" y="140" width="56" height="56" rx="14" fill="url(#g-pdf-to-word)"/><g transform="translate(554 154) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6zM14 3v4h4"/></g>
    <text x="614" y="158" font-size="19" font-weight="700" fill="#111">PDF a Word</text>
    <text x="614" y="182" font-size="14" fill="#6b6b73">Reconstruye párrafos, títulos, listas y</text><text x="614" y="202" font-size="14" fill="#6b6b73">tablas; con OCR para escaneados.</text><g filter="url(#sh)"><rect x="40" y="258" width="460" height="118" rx="22" fill="#fff"/></g><rect x="60" y="278" width="56" height="56" rx="14" fill="url(#g-excel-to-pdf)"/><g transform="translate(74 292) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4zM4 10h16M4 15h16M10 5v14"/></g>
    <text x="134" y="296" font-size="19" font-weight="700" fill="#111">Excel a PDF</text>
    <text x="134" y="320" font-size="14" fill="#6b6b73">Convierte hojas de cálculo y CSV, hoja por</text><text x="134" y="340" font-size="14" fill="#6b6b73">hoja, ajustadas al ancho.</text><g filter="url(#sh)"><rect x="520" y="258" width="460" height="118" rx="22" fill="#fff"/></g><rect x="540" y="278" width="56" height="56" rx="14" fill="url(#g-pdf-to-excel)"/><g transform="translate(554 292) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4zM4 10h16M4 15h16M10 5v14"/></g>
    <text x="614" y="296" font-size="19" font-weight="700" fill="#111">PDF a Excel</text>
    <text x="614" y="320" font-size="14" fill="#6b6b73">Detecta tablas y las exporta a .xlsx o CSV.</text><g filter="url(#sh)"><rect x="40" y="396" width="460" height="118" rx="22" fill="#fff"/></g><rect x="60" y="416" width="56" height="56" rx="14" fill="url(#g-pdf-to-pptx)"/><g transform="translate(74 430) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18v12H3zM12 16v4M8 20h8"/></g>
    <text x="134" y="434" font-size="19" font-weight="700" fill="#111">PDF a PowerPoint</text>
    <text x="134" y="458" font-size="14" fill="#6b6b73">Crea una presentación con imágenes fieles o</text><text x="134" y="478" font-size="14" fill="#6b6b73">texto editable.</text><g filter="url(#sh)"><rect x="520" y="396" width="460" height="118" rx="22" fill="#fff"/></g><rect x="540" y="416" width="56" height="56" rx="14" fill="url(#g-img-to-pdf)"/><g transform="translate(554 430) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M9 9.5h.01"/></g>
    <text x="614" y="434" font-size="19" font-weight="700" fill="#111">Imágenes a PDF</text>
    <text x="614" y="458" font-size="14" fill="#6b6b73">Une fotos en un PDF; gira, ajusta, comprime o</text><text x="614" y="478" font-size="14" fill="#6b6b73">usa la cámara del móvil.</text><g filter="url(#sh)"><rect x="40" y="534" width="460" height="118" rx="22" fill="#fff"/></g><rect x="60" y="554" width="56" height="56" rx="14" fill="url(#g-pdf-to-img)"/><g transform="translate(74 568) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M9 9.5h.01"/></g>
    <text x="134" y="572" font-size="19" font-weight="700" fill="#111">PDF a imágenes</text>
    <text x="134" y="596" font-size="14" fill="#6b6b73">Exporta PNG, JPG o WEBP hasta 300 dpi, o una</text><text x="134" y="616" font-size="14" fill="#6b6b73">sola imagen larga.</text><g filter="url(#sh)"><rect x="520" y="534" width="460" height="118" rx="22" fill="#fff"/></g><rect x="540" y="554" width="56" height="56" rx="14" fill="url(#g-text-to-pdf)"/><g transform="translate(554 568) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></g>
    <text x="614" y="572" font-size="19" font-weight="700" fill="#111">Texto a PDF</text>
    <text x="614" y="596" font-size="14" fill="#6b6b73">Editor con formato, texto plano o HTML;</text><text x="614" y="616" font-size="14" fill="#6b6b73">importa .txt, .html y .docx.</text><g filter="url(#sh)"><rect x="40" y="672" width="460" height="118" rx="22" fill="#fff"/></g><rect x="60" y="692" width="56" height="56" rx="14" fill="url(#g-ocr)"/><g transform="translate(74 706) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></g>
    <text x="134" y="710" font-size="19" font-weight="700" fill="#111">OCR (reconocer texto)</text>
    <text x="134" y="734" font-size="14" fill="#6b6b73">Hace buscable un PDF escaneado, o lo convierte</text><text x="134" y="754" font-size="14" fill="#6b6b73">a Word o texto.</text></svg>