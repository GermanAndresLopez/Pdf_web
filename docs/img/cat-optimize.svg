<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="426" viewBox="0 0 1000 426" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Inter,Helvetica,Arial,sans-serif">
  <defs><linearGradient id="g-compress" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fdc8c"/><stop offset="1" stop-color="#34c759"/></linearGradient><linearGradient id="g-grayscale" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9e9e9e"/><stop offset="1" stop-color="#4a4a4a"/></linearGradient><linearGradient id="g-flatten" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#80cbc4"/><stop offset="1" stop-color="#26897e"/></linearGradient><linearGradient id="g-repair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcc80"/><stop offset="1" stop-color="#fb8c00"/></linearGradient>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity=".09"/></filter></defs><rect width="1000" height="426" rx="28" fill="#f2f2f7"/>
  <text x="40" y="62" font-size="34" font-weight="800" fill="#111">Optimizar</text>
  <text x="40" y="92" font-size="16" fill="#6b6b73">4 herramientas</text><g filter="url(#sh)"><rect x="40" y="120" width="460" height="118" rx="22" fill="#fff"/></g><rect x="60" y="140" width="56" height="56" rx="14" fill="url(#g-compress)"/><g transform="translate(74 154) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></g>
    <text x="134" y="158" font-size="19" font-weight="700" fill="#111">Comprimir PDF</text>
    <text x="134" y="182" font-size="14" fill="#6b6b73">Sin pérdida, por nivel, personalizado o hasta</text><text x="134" y="202" font-size="14" fill="#6b6b73">un tamaño objetivo.</text><g filter="url(#sh)"><rect x="520" y="120" width="460" height="118" rx="22" fill="#fff"/></g><rect x="540" y="140" width="56" height="56" rx="14" fill="url(#g-grayscale)"/><g transform="translate(554 154) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 3v18"/></g>
    <text x="614" y="158" font-size="19" font-weight="700" fill="#111">Escala de grises / B/N</text>
    <text x="614" y="182" font-size="14" fill="#6b6b73">Ahorra tinta y peso; conserva el texto</text><text x="614" y="202" font-size="14" fill="#6b6b73">buscable.</text><g filter="url(#sh)"><rect x="40" y="258" width="460" height="118" rx="22" fill="#fff"/></g><rect x="60" y="278" width="56" height="56" rx="14" fill="url(#g-flatten)"/><g transform="translate(74 292) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5zM3 13l9 5 9-5"/></g>
    <text x="134" y="296" font-size="19" font-weight="700" fill="#111">Aplanar PDF</text>
    <text x="134" y="320" font-size="14" fill="#6b6b73">Fija formularios y anotaciones para que nadie</text><text x="134" y="340" font-size="14" fill="#6b6b73">pueda cambiarlos.</text><g filter="url(#sh)"><rect x="520" y="258" width="460" height="118" rx="22" fill="#fff"/></g><rect x="540" y="278" width="56" height="56" rx="14" fill="url(#g-repair)"/><g transform="translate(554 292) scale(1.1666666666666667)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6.5a4 4 0 0 0 4.9 4.9L10 20.8a2.1 2.1 0 0 1-3-3z"/></g>
    <text x="614" y="296" font-size="19" font-weight="700" fill="#111">Reparar PDF</text>
    <text x="614" y="320" font-size="14" fill="#6b6b73">Recupera páginas de un archivo dañado que no</text><text x="614" y="340" font-size="14" fill="#6b6b73">se abre.</text></svg>